appId: gov.dallascityhall.parks
name: Skip flag lands on Discover directly
---
# Requires a bundle built or served with EXPO_PUBLIC_SKIP_ONBOARDING=1
# (`npm run start:skip-intro`). The variable is inlined at build time, so it
# cannot be set from here.
- clearState
- launchApp

# Even with no completed onboarding in storage, the dev-only skip flag applies.
- assertVisible:
    id: 'screen-discover'
- assertNotVisible:
    id: 'onboarding-welcome'
