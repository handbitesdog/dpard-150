appId: gov.dallascityhall.parks
name: Onboarding runs once on a fresh install
---
# Against a dev-client build, clearState also wipes the dev client's saved
# Metro connection, so launchApp lands on its native "Development servers"
# picker instead of the app. Tap the listed server there manually before this
# flow will find `onboarding-welcome` -- Maestro can't do it (it's outside
# the RN view tree). A standalone/preview build has no such screen and
# doesn't need this. See README.md, "Tests".
#
# Fresh install: welcome -> 4 slides -> Discover.
- clearState
- launchApp

- assertVisible:
    id: 'onboarding-welcome'
- tapOn:
    id: 'onboarding-get-started'

- assertVisible: 'Learn'
- assertVisible:
    id: 'onboarding-advance'
- tapOn:
    id: 'onboarding-advance'

- assertVisible: 'Collect'
- tapOn:
    id: 'onboarding-advance'

- assertVisible: 'Listen'
- tapOn:
    id: 'onboarding-advance'

- assertVisible: 'Connect'
- assertVisible: "Let's go!"
- tapOn:
    id: 'onboarding-advance'

- assertVisible:
    id: 'screen-discover'

# Relaunch without clearing state: straight to Discover, no intro.
- launchApp
- assertVisible:
    id: 'screen-discover'
- assertNotVisible:
    id: 'onboarding-welcome'
